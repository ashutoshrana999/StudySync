<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudySync | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-brand">
        <div class="brand-mark">SS</div>
        <div>
          <div class="brand-title">StudySync</div>
          <div class="brand-sub">Library / Study Room Management</div>
        </div>
      </div>

      <div class="card auth-card">
        <div class="card-body p-4">
          <div class="d-flex gap-2 mb-3">
            <button id="tabLogin" class="btn btn-sm btn-primary w-50">Login</button>
            <button id="tabRegister" class="btn btn-sm btn-outline-primary w-50">Register</button>
          </div>

          <form id="loginForm" class="vstack gap-3">
            <div>
              <label class="form-label">Email</label>
              <input name="email" type="email" class="form-control" placeholder="you@example.com" required />
            </div>
            <div>
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control" placeholder="••••••••" required />
            </div>
            <div class="d-flex align-items-center justify-content-between">
              <label class="form-check">
                <input class="form-check-input" type="checkbox" name="remember" checked />
                <span class="form-check-label">Remember me</span>
              </label>
              <span class="muted small">Admin accounts are created via backend script.</span>
            </div>
            <button class="btn btn-primary w-100" type="submit">
              <span class="btn-text">Login</span>
              <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
            </button>
          </form>

          <form id="registerForm" class="vstack gap-3 d-none">
            <div>
              <label class="form-label">Full Name</label>
              <input name="name" class="form-control" placeholder="Your name" minlength="2" required />
            </div>
            <div>
              <label class="form-label">Email</label>
              <input name="email" type="email" class="form-control" placeholder="you@example.com" required />
            </div>
            <div>
              <label class="form-label">Phone (optional)</label>
              <input name="phone" class="form-control" placeholder="+91..." />
            </div>
            <div>
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control" placeholder="Min 6 characters" minlength="6" required />
            </div>
            <div>
              <label class="form-label">Confirm Password</label>
              <input name="password2" type="password" class="form-control" placeholder="Repeat password" minlength="6" required />
            </div>
            <label class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" checked />
              <span class="form-check-label">Remember me</span>
            </label>
            <button class="btn btn-primary w-100" type="submit">
              <span class="btn-text">Create account</span>
              <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
            </button>
          </form>
        </div>
      </div>

      <div class="auth-footer small muted">
        Tip: run `npm run create-admin` in `backend/` once to create your admin account.
      </div>
    </div>

    <div id="toastHost" class="toast-host"></div>

    <script type="module" src="./js/pages/authPage.js"></script>
  </body>
</html>
